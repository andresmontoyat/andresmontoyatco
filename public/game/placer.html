<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Asset Placer — World RPG</title>
<style>
  :root { --bg:#0b1020; --panel:#131a30; --line:#2a3350; --accent:#00e5a8; --text:#dfeaff; --muted:#7f8db0; }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.4 ui-monospace,Menlo,monospace; background:var(--bg); color:var(--text); height:100vh; display:grid; grid-template-columns:300px 1fr; grid-template-rows:1fr auto; grid-template-areas:"palette map" "palette out"; }
  h2 { font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--accent); margin:0 0 8px; }
  #palette { grid-area:palette; background:var(--panel); border-right:1px solid var(--line); padding:10px; overflow-y:auto; }
  #search, #cat, #src { width:100%; padding:6px 8px; background:#0b1020; border:1px solid var(--line); color:var(--text); border-radius:6px; margin-bottom:6px; }
  #src { border-color:var(--accent); }
  #sizerow { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:11px; margin-bottom:8px; }
  #sizerow input { flex:1; }
  #preview { background:#0b1020; border:1px solid var(--line); border-radius:6px; padding:8px; margin-bottom:8px; display:flex; flex-direction:column; align-items:center; gap:6px; }
  #pcanvas { image-rendering:pixelated; width:120px; height:120px; background:conic-gradient(#141a30 25%,#0b1020 0 50%,#141a30 0 75%,#0b1020 0); background-size:16px 16px; border-radius:4px; }
  #pinfo { font-size:10px; color:var(--muted); text-align:center; word-break:break-all; }
  .cathead { font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--accent); margin:10px 0 4px; opacity:.85; }
  #frames { display:flex; flex-direction:column; gap:2px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,var(--cell,46px)); gap:4px; }
  .cell { background:#0b1020; border:1px solid var(--line); border-radius:5px; padding:2px; cursor:pointer; }
  .cell:hover { border-color:var(--accent); }
  .cell.sel { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .cell canvas { image-rendering:pixelated; width:100%; display:block; aspect-ratio:1; }
  #map { grid-area:map; display:block; width:100%; height:100%; background:#3f6a3a; cursor:crosshair; }
  #out { grid-area:out; background:var(--panel); border-top:1px solid var(--line); padding:8px 10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  button { background:var(--accent); color:#04121a; border:0; padding:6px 12px; border-radius:6px; font-weight:700; cursor:pointer; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  #status { color:var(--muted); }
  #json { flex:1 1 100%; min-height:60px; background:#0b1020; border:1px solid var(--line); color:var(--text); border-radius:6px; padding:6px; font:11px/1.3 ui-monospace,monospace; display:none; }
  .hint { color:var(--muted); font-size:11px; }
</style>
</head>
<body>
  <div id="palette">
    <h2>Assets (atlas)</h2>
    <input id="search" placeholder="buscar… (tree, house, bee)" />
    <select id="src"><option value="atlas">Atlas (en el juego · 235)</option><option value="pack">Pack completo (717)</option></select>
    <select id="cat"></select>
    <div id="sizerow"><span>zoom</span><input id="size" type="range" min="32" max="96" value="46" /></div>
    <div id="preview"><canvas id="pcanvas"></canvas><div id="pinfo">pasa el mouse por un asset</div></div>
    <div id="frames"></div>
  </div>
  <canvas id="map"></canvas>
  <div id="out">
    <span id="status">cargando…</span>
    <span class="hint">click asset → click mapa = colocar · arrastra = mover · Supr = borrar</span>
    <span style="flex:1"></span>
    <button id="export">Export JSON</button>
    <button id="clear" class="ghost">Limpiar</button>
    <textarea id="json" readonly></textarea>
  </div>
<script>
const S = { atlas:null, meta:null, world:null, pack:null, srcMode:'atlas', scale:1, ox:0, oy:0, sel:null, placed:[], selPlaced:-1, drag:false };
const $ = s => document.querySelector(s);

async function boot() {
  const [meta, world] = await Promise.all([
    fetch('/game/atlas.json').then(r=>r.json()),
    fetch('/game/world-snapshot.json').then(r=>r.json()),
  ]);
  S.meta = meta; S.world = world;
  S.atlas = new Image(); S.atlas.src = meta.images.atlas;
  await S.atlas.decode();
  imgCache[meta.images.atlas] = S.atlas;
  fillCats(); buildPalette();
  fit(); draw();
  $('#status').textContent = Object.keys(meta.frames).length + ' frames · ' + world.sites.length + ' sitios';
}

// ---- categories + palette -----------------------------------------------------
const CAT_ORDER = ['Suelo','Camino','Agua','Edificios','Árboles','Decor','Animales','NPCs','Hero','Otros'];
const CATS = [
  ['Suelo', n=>/^ground_/.test(n)],
  ['Camino', n=>/^path_/.test(n)],
  ['Agua', n=>/^(water|lilypad|cattail)/.test(n)],
  ['Edificios', n=>/^(house|church|inn|blacksmith|barn|windmill)/.test(n)],
  ['Árboles', n=>/^tree/.test(n)],
  ['Decor', n=>/^(bush|rock|flower|fence)/.test(n)],
  ['Animales', n=>/^(chicken|duck|cow|pig|sheep|frog|kapybara)/.test(n)],
  ['NPCs', n=>/^npc_/.test(n)],
  ['Hero', n=>/^(carlos|legs|feet|chest|hair)_/.test(n)],
];
const catOf = name => (CATS.find(([,t])=>t(name)) || ['Otros'])[0];

// image cache (atlas pre-seeded); pack images load lazily and trigger a rebuild on load
const imgCache = {};
function getImg(src){ if(imgCache[src]) return imgCache[src]; const im=new Image(); im.src=src; imgCache[src]=im; im.onload=()=>buildPalette(); return im; }
// A palette entry = descriptor {name, cat, src, sx, sy, sw, sh}
function atlasEntries(){ return Object.keys(S.meta.frames).map(name=>{ const f=S.meta.frames[name]; return {name, cat:catOf(name), src:S.meta.images.atlas, sx:f.x, sy:f.y, sw:f.w, sh:f.h}; }); }
function packEntries(){ return S.pack.map(it=>({name:it.name, cat:it.folder, src:it.src, sx:0, sy:0, sw:it.w, sh:it.h})); }
function entries(){ return S.srcMode==='pack' ? packEntries() : atlasEntries(); }
function drawDesc(g, d, size){ const im=getImg(d.src); if(!im.complete||!im.naturalWidth) return; const s=Math.min(size/d.sw, size/d.sh); g.drawImage(im, d.sx,d.sy,d.sw,d.sh, (size-d.sw*s)/2, (size-d.sh*s)/2, d.sw*s, d.sh*s); }
function thumb(d, px){ const c=document.createElement('canvas'); c.width=px; c.height=px; const g=c.getContext('2d'); g.imageSmoothingEnabled=false; drawDesc(g,d,px); return c; }
function showPreview(d){ S.sel=d; const c=$('#pcanvas'); c.width=120; c.height=120; const g=c.getContext('2d'); g.imageSmoothingEnabled=false; g.clearRect(0,0,120,120); drawDesc(g,d,120); $('#pinfo').textContent = `${d.name} · ${d.sw}×${d.sh}`; }
function catsPresent(){ return [...new Set(entries().map(e=>e.cat))]; }
function fillCats(){ const sel=$('#cat'); sel.innerHTML='<option value="__all">Todas las categorías</option>'; const present=catsPresent(); const order = S.srcMode==='pack' ? present.sort() : CAT_ORDER.filter(c=>present.includes(c)); order.forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o); }); }
function buildPalette(){
  const filter=$('#search').value.trim().toLowerCase(), catSel=$('#cat').value, px=+$('#size').value;
  const host=$('#frames'); host.innerHTML='';
  if(S.srcMode==='pack' && catSel==='__all' && !filter){ host.innerHTML='<div class="cathead">elige una carpeta o busca… (717 imágenes)</div>'; return; }
  const list = entries().filter(e=>e.name.toLowerCase().includes(filter) && (catSel==='__all'||e.cat===catSel)).sort((a,b)=>a.name.localeCompare(b.name));
  const byCat={}; list.forEach(e=>{ (byCat[e.cat]=byCat[e.cat]||[]).push(e); });
  const order = S.srcMode==='pack' ? Object.keys(byCat).sort() : CAT_ORDER.filter(c=>byCat[c]);
  order.forEach(cat=>{
    const h=document.createElement('div'); h.className='cathead'; h.textContent=`${cat} (${byCat[cat].length})`; host.appendChild(h);
    const grid=document.createElement('div'); grid.className='grid'; grid.style.setProperty('--cell', px+'px');
    byCat[cat].forEach(d=>{
      const cell=document.createElement('div'); cell.className='cell'+(S.sel&&S.sel.src===d.src&&S.sel.sx===d.sx&&S.sel.name===d.name?' sel':''); cell.title=d.name;
      cell.appendChild(thumb(d, px-6));
      cell.onmouseenter=()=>showPreview(d);
      cell.onclick=()=>{ showPreview(d); document.querySelectorAll('.cell').forEach(c=>c.classList.remove('sel')); cell.classList.add('sel'); };
      grid.appendChild(cell);
    });
    host.appendChild(grid);
  });
}
$('#search').oninput=buildPalette; $('#cat').onchange=buildPalette; $('#size').oninput=buildPalette;
$('#src').onchange = async e => { S.srcMode=e.target.value;
  if(S.srcMode==='pack' && !S.pack){ $('#status').textContent='cargando pack…'; S.pack=await fetch('/game/pack-index.json').then(r=>r.json()); }
  $('#cat').value='__all'; fillCats(); buildPalette();
  $('#status').textContent = S.srcMode==='pack' ? S.pack.length+' imágenes del pack' : Object.keys(S.meta.frames).length+' frames del atlas';
};

// ---- map ----------------------------------------------------------------------
function fit() {
  const map = $('#map'); const r = map.getBoundingClientRect();
  map.width = r.width; map.height = r.height;
  S.scale = Math.min(map.width/S.world.worldW, map.height/S.world.worldH) * 0.96;
  S.ox = (map.width - S.world.worldW*S.scale)/2;
  S.oy = (map.height - S.world.worldH*S.scale)/2;
}
const wx2sx = x => x*S.scale + S.ox, wy2sy = y => y*S.scale + S.oy;
const sx2wx = x => (x-S.ox)/S.scale, sy2wy = y => (y-S.oy)/S.scale;

function draw() {
  const g = $('#map').getContext('2d'); g.imageSmoothingEnabled=false;
  const W = S.world;
  g.fillStyle='#3f6a3a'; g.fillRect(0,0,$('#map').width,$('#map').height);
  // world bounds
  g.strokeStyle='#2a3350'; g.strokeRect(wx2sx(0),wy2sy(0),W.worldW*S.scale,W.worldH*S.scale);
  // roads
  g.strokeStyle='#8a8f7a'; g.lineWidth=Math.max(2,6*S.scale);
  W.roads.forEach(r=>{ g.beginPath(); g.moveTo(wx2sx(r.a.x),wy2sy(r.a.y)); g.lineTo(wx2sx(r.b.x),wy2sy(r.b.y)); g.stroke(); });
  // ponds
  W.ponds.forEach(p=>{ g.fillStyle='rgba(60,150,220,0.7)'; g.beginPath(); g.arc(wx2sx(p.x),wy2sy(p.y),p.r*S.scale,0,7); g.fill(); });
  // farm
  g.fillStyle='#caa15a'; g.fillRect(wx2sx(W.farm.x)-4,wy2sy(W.farm.y)-4,8,8);
  // sites
  g.font='10px monospace'; g.textAlign='center';
  W.sites.forEach(s=>{ const x=wx2sx(s.cx-s.w/2), y=wy2sy(s.cy);
    g.fillStyle='rgba(155,111,208,0.5)'; g.fillRect(x,y,s.w*S.scale,s.h*S.scale);
    g.fillStyle='#dfeaff'; g.fillText(s.co, wx2sx(s.cx), y-3);
  });
  // placed assets (real sprites, world-scaled, bottom-anchored)
  S.placed.forEach((it,i)=>{ const d=it.d; const im=getImg(d.src); if(!im.complete||!im.naturalWidth) return;
    const dw=d.sw*S.scale, dh=d.sh*S.scale;
    g.drawImage(im, d.sx,d.sy,d.sw,d.sh, wx2sx(it.x)-dw/2, wy2sy(it.y)-dh, dw, dh);
    if(i===S.selPlaced){ g.strokeStyle='#00e5a8'; g.lineWidth=1.5; g.strokeRect(wx2sx(it.x)-dw/2,wy2sy(it.y)-dh,dw,dh); }
  });
}

function hitPlaced(mx,my){
  for(let i=S.placed.length-1;i>=0;i--){ const it=S.placed[i], d=it.d;
    const dw=d.sw*S.scale, dh=d.sh*S.scale, x=wx2sx(it.x)-dw/2, y=wy2sy(it.y)-dh;
    if(mx>=x&&mx<=x+dw&&my>=y&&my<=y+dh) return i;
  }
  return -1;
}
const map = $('#map');
map.onmousedown = e=>{ const b=map.getBoundingClientRect(), mx=e.clientX-b.left, my=e.clientY-b.top;
  const hit=hitPlaced(mx,my);
  if(hit>=0){ S.selPlaced=hit; S.drag=true; }
  else if(S.sel){ S.placed.push({d:S.sel, x:Math.round(sx2wx(mx)), y:Math.round(sy2wy(my))}); S.selPlaced=S.placed.length-1; }
  else S.selPlaced=-1;
  draw();
};
map.onmousemove = e=>{ if(!S.drag||S.selPlaced<0) return; const b=map.getBoundingClientRect();
  S.placed[S.selPlaced].x=Math.round(sx2wx(e.clientX-b.left)); S.placed[S.selPlaced].y=Math.round(sy2wy(e.clientY-b.top)); draw();
};
window.onmouseup = ()=>{ S.drag=false; };
window.onkeydown = e=>{ if((e.key==='Delete'||e.key==='Backspace')&&S.selPlaced>=0){ S.placed.splice(S.selPlaced,1); S.selPlaced=-1; draw(); } };
window.onresize = ()=>{ fit(); draw(); };

$('#export').onclick = ()=>{ const out = S.placed.map(it=>{ const d=it.d; const base = d.src===S.meta.images.atlas ? {frame:d.name} : {src:d.src, w:d.sw, h:d.sh}; return {...base, x:it.x, y:it.y}; }); const j=JSON.stringify(out,null,2); const t=$('#json'); t.style.display='block'; t.value=j; t.select();
  navigator.clipboard?.writeText(j); $('#status').textContent='copiado al portapapeles ('+S.placed.length+' items)'; };
$('#clear').onclick = ()=>{ S.placed=[]; S.selPlaced=-1; $('#json').style.display='none'; draw(); };

boot().catch(e=>{ $('#status').textContent='error: '+e.message; console.error(e); });
</script>
</body>
</html>
